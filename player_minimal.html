<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Los Huevitos Sorpresa</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0a0a0a;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .frame {
      width: 100%;
      max-width: 480px;
      aspect-ratio: 9/16;
      background: #111;
      border-radius: 32px;
      overflow: hidden;
      box-shadow: 0 40px 80px rgba(0, 0, 0, 0.8);
      display: flex;
      flex-direction: column;
    }

    .video-area {
      flex: 1;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .controls-bar {
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(20px);
      padding: 16px;
      display: flex;
      gap: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    .control-btn {
      flex: 1;
      padding: 12px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.5px;
      transition: all 0.3s;
    }

    .control-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.25);
    }

    .control-btn.active {
      background: rgba(102, 126, 234, 0.8);
      border-color: rgba(102, 126, 234, 1);
    }

    .info-panel {
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(10px);
      padding: 20px 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      font-size: 13px;
      line-height: 1.6;
      color: rgba(255, 255, 255, 0.7);
    }

    .info-title {
      font-size: 14px;
      font-weight: 600;
      color: #fff;
      margin-bottom: 8px;
      letter-spacing: 0.3px;
    }

    .spec-row {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .spec-row:last-child {
      border-bottom: none;
    }

    .spec-label {
      color: rgba(255, 255, 255, 0.5);
    }

    .spec-value {
      color: rgba(102, 126, 234, 0.9);
      font-weight: 500;
    }

    @media (max-width: 500px) {
      .frame {
        border-radius: 24px;
      }
    }
  </style>
</head>
<body>
  <div class="frame">
    <div class="video-area">
      <video id="mainVideo" controls autoplay muted loop>
        <source id="videoSource" src="huevitos_60s_final.mp4" type="video/mp4">
      </video>
    </div>

    <div class="controls-bar">
      <button class="control-btn active" onclick="switchVideo('final')">Final</button>
      <button class="control-btn" onclick="switchVideo('skyreels')">Skyreels</button>
      <button class="control-btn" onclick="switchVideo('profesional')">Base</button>
    </div>

    <div class="info-panel">
      <div class="info-title">🎬 Los Huevitos Sorpresa</div>
      <div class="spec-row">
        <span class="spec-label">Duración</span>
        <span class="spec-value">60 segundos</span>
      </div>
      <div class="spec-row">
        <span class="spec-label">Resolución</span>
        <span class="spec-value">1080×1920</span>
      </div>
      <div class="spec-row">
        <span class="spec-label">Formato</span>
        <span class="spec-value" id="sizeInfo">1.7 MB</span>
      </div>
      <div class="spec-row">
        <span class="spec-label">Codec</span>
        <span class="spec-value">H.264 CRF 14</span>
      </div>
    </div>
  </div>

  <script>
    const videos = {
      'final': { src: 'huevitos_60s_final.mp4', size: '1.7 MB' },
      'skyreels': { src: 'huevitos_60s_skyreels.mp4', size: '1.8 MB' },
      'profesional': { src: 'huevitos_60s_profesional.mp4', size: '1.1 MB' }
    };

    function switchVideo(version) {
      const video = document.getElementById('mainVideo');
      const source = document.getElementById('videoSource');
      const sizeInfo = document.getElementById('sizeInfo');

      source.src = videos[version].src;
      sizeInfo.textContent = videos[version].size;
      video.load();
      video.play();

      document.querySelectorAll('.control-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
    }
  </script>
</body>
</html>
