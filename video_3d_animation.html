<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; }
    body { width: 1080px; height: 1920px; overflow: hidden; background: #87CEEB; }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    const canvas = document.getElementById('canvas');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, 1080/1920, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({canvas, antialias: true});
    renderer.setSize(1080, 1920);
    renderer.setClearColor(0x87CEEB);
    
    // Iluminación
    const light1 = new THREE.DirectionalLight(0xffffff, 1);
    light1.position.set(5, 5, 5);
    scene.add(light1);
    
    const light2 = new THREE.PointLight(0xff6b9d, 0.8);
    light2.position.set(-3, 3, 2);
    scene.add(light2);
    
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);
    
    camera.position.z = 8;
    
    // Crear 3 esferas (huevos) con gradiente
    const eggs = [];
    const colors = [0xFF6B6B, 0x4ECDC4, 0xFFD93D];
    const positions = [-2.5, 0, 2.5];
    
    colors.forEach((color, i) => {
      const geometry = new THREE.SphereGeometry(0.8, 32, 32);
      const material = new THREE.MeshStandardMaterial({
        color: color,
        metalness: 0.3,
        roughness: 0.4
      });
      const egg = new THREE.Mesh(geometry, material);
      egg.position.x = positions[i];
      egg.position.y = 3;
      egg.castShadow = true;
      scene.add(egg);
      eggs.push({mesh: egg, vx: (Math.random() - 0.5) * 0.05, vy: 0.15});
    });
    
    // Texto 3D
    const canvas2D = document.createElement('canvas');
    canvas2D.width = 1024;
    canvas2D.height = 512;
    const ctx = canvas2D.getContext('2d');
    ctx.fillStyle = 'white';
    ctx.font = 'bold 120px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('¿QUIÉN ESTÁ ADENTRO?', 512, 200);
    
    const texture = new THREE.CanvasTexture(canvas2D);
    const textGeo = new THREE.PlaneGeometry(6, 2);
    const textMat = new THREE.MeshBasicMaterial({map: texture});
    const textMesh = new THREE.Mesh(textGeo, textMat);
    textMesh.position.y = -2;
    textMesh.position.z = 0;
    scene.add(textMesh);
    
    // Animación
    const clock = new THREE.Clock();
    let sceneIndex = 0;
    
    function animate() {
      requestAnimationFrame(animate);
      const time = clock.getElapsedTime();
      
      // Física de huevos
      eggs.forEach((egg, i) => {
        egg.mesh.position.y += egg.vy;
        egg.vy -= 0.005; // gravedad
        
        // Rebote
        if (egg.mesh.position.y < -3) {
          egg.mesh.position.y = -3;
          egg.vy *= -0.8;
        }
        
        // Rotación
        egg.mesh.rotation.x += 0.01;
        egg.mesh.rotation.y += 0.02;
      });
      
      // Cambiar escena
      if (time > 5 && time <= 12) {
        // Pollito
        scene.clear();
        scene.add(light1);
        scene.add(light2);
        scene.add(ambientLight);
        
        const geo = new THREE.SphereGeometry(0.5, 32, 32);
        const mat = new THREE.MeshStandardMaterial({color: 0xFFD700});
        const chick = new THREE.Mesh(geo, mat);
        chick.scale.y = 0.8;
        chick.position.y = Math.sin(time * 2) * 0.3;
        scene.add(chick);
        
        camera.position.z = 5;
      } else if (time > 12 && time <= 20) {
        // Patito
        scene.clear();
        scene.add(light1);
        scene.add(light2);
        scene.add(ambientLight);
        
        const geo = new THREE.ConeGeometry(0.4, 0.6, 32);
        const mat = new THREE.MeshStandardMaterial({color: 0xFF8C42});
        const duck = new THREE.Mesh(geo, mat);
        duck.rotation.z = Math.sin(time * 1.5) * 0.2;
        duck.position.y = Math.cos(time * 2) * 0.4;
        scene.add(duck);
        
        camera.position.z = 5;
      } else if (time > 20 && time <= 28) {
        // Conejito
        scene.clear();
        scene.add(light1);
        scene.add(light2);
        scene.add(ambientLight);
        
        const geo = new THREE.OctahedronGeometry(0.5, 3);
        const mat = new THREE.MeshStandardMaterial({color: 0xFF69B4});
        const bunny = new THREE.Mesh(geo, mat);
        bunny.position.y = Math.abs(Math.sin(time * 3)) * 0.8;
        scene.add(bunny);
        
        camera.position.z = 5;
      } else if (time > 28 && time <= 45) {
        // Todos
        scene.clear();
        scene.add(light1);
        scene.add(light2);
        scene.add(ambientLight);
        
        const createBall = (color, x) => {
          const g = new THREE.SphereGeometry(0.4, 32, 32);
          const m = new THREE.MeshStandardMaterial({color});
          const b = new THREE.Mesh(g, m);
          b.position.x = x;
          b.position.y = Math.sin(time * 2.5 + x) * 0.5;
          return b;
        };
        
        scene.add(createBall(0xFFD700, -1.5));
        scene.add(createBall(0xFF8C42, 0));
        scene.add(createBall(0xFF69B4, 1.5));
        
        camera.position.z = 6;
      } else if (time > 45) {
        // Finale
        scene.clear();
        scene.add(light1);
        scene.add(light2);
        scene.add(ambientLight);
        
        const createBall = (color, x) => {
          const g = new THREE.SphereGeometry(0.4, 32, 32);
          const m = new THREE.MeshStandardMaterial({color, emissive: color, emissiveIntensity: 0.3});
          const b = new THREE.Mesh(g, m);
          b.position.x = x;
          b.position.y = Math.sin(time * 3 + x) * 0.6;
          b.rotation.x += 0.02;
          b.rotation.y += 0.03;
          return b;
        };
        
        scene.add(createBall(0xFFD700, -1.5));
        scene.add(createBall(0xFF8C42, 0));
        scene.add(createBall(0xFF69B4, 1.5));
        
        camera.position.z = 6;
      }
      
      renderer.render(scene, camera);
    }
    
    animate();
  </script>
</body>
</html>
