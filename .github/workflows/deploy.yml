name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/youthful-noether-u6crkg]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Copy frontend-v2 to docs
        run: |
          rm -rf docs
          mkdir -p docs
          cp -r frontend-v2/* docs/
          touch docs/.nojekyll
          echo "✓ Frontend copied to docs/"

      - name: Commit & Push
        run: |
          git config user.email "claude@anthropic.com"
          git config user.name "Claude Deploy Bot"
          git add docs/
          git commit -m "deploy: update GitHub Pages site from frontend-v2" || echo "No changes to commit"
          git push origin main
