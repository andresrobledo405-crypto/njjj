<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="/static/manifest.webmanifest">
<title>Clínica Pro</title>
<style>
:root{--bg:#f4f7f6;--card:#fff;--ink:#12302d;--mute:#5d7471;--line:#dbe5e3;--brand:#0f766e;--brand-ink:#fff;--warn:#b45309;--bad:#b91c1c;--ok:#15803d}
@media (prefers-color-scheme:dark){:root{--bg:#0d1b1a;--card:#14292777;--ink:#e6f2f0;--mute:#93b0ac;--line:#24403d;--brand:#2dd4bf;--brand-ink:#04211e}}
*{box-sizing:border-box}body{margin:0;font:16px/1.45 system-ui,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:5rem}
header{padding:1rem;display:flex;justify-content:space-between;align-items:center}h1{font-size:1.25rem;margin:0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:.6rem;padding:0 1rem}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:.7rem}.stat b{display:block;font-size:1.5rem}.stat span{color:var(--mute);font-size:.8rem}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:.8rem .2rem;border:0;background:none;color:var(--mute);font:inherit;font-size:.85rem}nav button[aria-selected=true]{color:var(--brand);font-weight:700}
main{padding:1rem;max-width:760px;margin:auto}section[hidden]{display:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:.8rem;margin-bottom:.6rem}
.row{display:flex;justify-content:space-between;gap:.5rem;align-items:center}.mute{color:var(--mute);font-size:.85rem}
form{display:grid;gap:.5rem;margin-bottom:1rem}input,select,textarea,button.p{font:inherit;padding:.65rem;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);width:100%}
button.p{background:var(--brand);color:var(--brand-ink);border:0;font-weight:700;transition:transform .12s ease-out}button.p:active{transform:scale(.97)}
.tag{font-size:.75rem;padding:.1rem .5rem;border-radius:99px;border:1px solid var(--line)}.warn{color:var(--warn)}
.mini{border:1px solid var(--line);background:none;color:var(--ink);border-radius:8px;padding:.3rem .5rem;font:inherit;font-size:.8rem}
#msg{position:fixed;top:.6rem;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:.5rem 1rem;border-radius:99px;opacity:0;transition:opacity .22s ease-out;pointer-events:none}#msg.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><h1>🩺 Clínica Pro</h1><a class="mini" href="/api/export/appointments.csv">Excel</a></header>
<div class="stats" id="stats"></div>
<main>
<section id="agenda"><form id="fDay"><input type="date" id="day"></form><div id="agendaList"></div>
<h3>Nueva cita</h3>
<form id="fAppt"><select id="aPatient" required></select><select id="aPro" required></select>
<input type="datetime-local" id="aStart" required><input id="aRoom" placeholder="Sala / Box"><input id="aReason" placeholder="Motivo">
<button class="p">Agendar</button></form></section>
<section id="pacientes" hidden><form id="fPat"><input id="pName" placeholder="Nombre completo" required><input id="pRut" placeholder="RUT"><input id="pPhone" placeholder="Teléfono" inputmode="tel"><input id="pAll" placeholder="Alergias"><button class="p">Registrar paciente</button></form><div id="patList"></div></section>
<section id="atencion" hidden><form id="fCons"><select id="cPatient" required></select><select id="cPro" required></select>
<input id="cDiag" placeholder="Diagnóstico"><textarea id="cTreat" placeholder="Tratamiento / indicaciones" rows="2"></textarea><input type="file" id="cFile" accept="image/*,.pdf" capture="environment"><button class="p">Guardar atención</button></form><div id="consList"></div></section>
<section id="caja" hidden><form id="fPay"><select id="yPatient" required></select><input id="yConcept" placeholder="Concepto" required><input id="yAmount" type="number" min="0" placeholder="Monto CLP" required>
<select id="yMethod"><option value="cash">Efectivo</option><option value="card">Tarjeta</option><option value="transfer">Transferencia</option><option value="insurance">Seguro / Isapre</option></select><button class="p">Registrar pago</button></form><a class="mini" href="/api/export/payments.csv">Descargar pagos (Excel)</a><div id="payList"></div></section>
</main>
<nav role="tablist"><button aria-selected="true" data-t="agenda">Agenda</button><button data-t="pacientes">Pacientes</button><button data-t="atencion">Atención</button><button data-t="caja">Caja</button></nav>
<div id="msg" role="status"></div>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ST={scheduled:"Agendada",arrived:"En espera",done:"Realizada",cancelled:"Cancelada",no_show:"No asistió"};
const clp=n=>new Intl.NumberFormat("es-CL",{style:"currency",currency:"CLP",maximumFractionDigits:0}).format(n);
async function api(u,o){const r=await fetch(u,o);if(!r.ok){let d="Error";try{d=(await r.json()).detail}catch{};throw new Error(typeof d==="string"?d:"Datos inválidos")}return r.status===204?null:r.json()}
function say(t){const m=$("msg");m.textContent=t;m.classList.add("on");setTimeout(()=>m.classList.remove("on"),2400)}
const post=(u,b)=>api(u,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)});
let pats=[],pros=[];
const opts=(l,f)=>l.map(x=>`<option value="${x.id}">${esc(f(x))}</option>`).join("");
async function stats(){const d=await api("/api/dashboard");$("stats").innerHTML=[["Citas hoy",d.today_appointments],["Pendientes",d.today_pending],["Realizadas",d.today_done],["Pacientes",d.patients],["Ingresos mes",clp(d.month_revenue)]].map(([k,v])=>`<div class="stat"><b>${v}</b><span>${k}</span></div>`).join("")}
async function agenda(){const l=await api("/api/agenda?day="+$("day").value);$("agendaList").innerHTML=l.length?l.map(a=>`<div class="card"><div class="row"><b>${a.starts_at.slice(11)} · ${esc(a.patient_name)}</b><span class="tag">${ST[a.status]}</span></div><div class="mute">${esc(a.professional_name)} · ${esc(a.specialty)}${a.room?" · "+esc(a.room):""}${a.reason?" · "+esc(a.reason):""}</div>${a.allergies?`<div class="warn">⚠ Alergias: ${esc(a.allergies)}</div>`:""}<div class="row" style="justify-content:flex-start;margin-top:.4rem">${Object.entries(ST).filter(([k])=>k!==a.status).map(([k,v])=>`<button class="mini" data-s="${k}" data-id="${a.id}">${v}</button>`).join("")}</div></div>`).join(""):'<p class="mute">Sin citas para este día.</p>'}
async function lists(){[pats,pros]=await Promise.all([api("/api/patients"),api("/api/professionals")]);const po=opts(pats,p=>p.name+(p.rut?" · "+p.rut:"")),pr=opts(pros,p=>p.name+" · "+p.specialty);["aPatient","cPatient","yPatient"].forEach(i=>$(i).innerHTML=po);["aPro","cPro"].forEach(i=>$(i).innerHTML=pr);
$("patList").innerHTML=pats.map(p=>`<div class="card"><b>${esc(p.name)}</b><div class="mute">${esc(p.rut||"sin RUT")} · ${esc(p.phone||"sin teléfono")}</div>${p.allergies?`<div class="warn">⚠ ${esc(p.allergies)}</div>`:""}</div>`).join("")||'<p class="mute">Aún no hay pacientes.</p>'}
async function cons(){const l=await api("/api/consultations");$("consList").innerHTML=l.map(c=>`<div class="card"><b>${esc(c.patient_name)}</b> <span class="mute">${c.occurred_at.slice(0,16)}</span><div>${esc(c.diagnosis||"")}</div><div class="mute">${esc(c.treatment||"")} · ${esc(c.professional_name)}</div>${c.attachment_path?`<a class="mini" href="/api/consultations/${c.id}/attachment" target="_blank">Ver adjunto</a>`:""}</div>`).join("")}
async function pays(){const l=await api("/api/payments");$("payList").innerHTML=l.slice(0,30).map(y=>{const p=pats.find(x=>x.id===y.patient_id);return`<div class="card row"><span>${esc(y.concept)}<br><span class="mute">${esc(p?p.name:"")} · ${y.paid_at.slice(0,16)}</span></span><b>${clp(y.amount)}</b></div>`}).join("")}
const refresh=()=>Promise.all([stats(),agenda(),lists().then(pays),cons()]).catch(e=>say(e.message));
const form=(id,fn)=>$(id).addEventListener("submit",async e=>{e.preventDefault();try{await fn();e.target.reset?.();$("day").value=$("day").value||new Date().toISOString().slice(0,10);say("Guardado");await refresh()}catch(x){say(x.message)}});
form("fAppt",async()=>{const s=$("aStart").value;await post("/api/appointments",{patient_id:+$("aPatient").value,professional_id:+$("aPro").value,starts_at:s,room:$("aRoom").value||null,reason:$("aReason").value||null});$("day").value=s.slice(0,10)});
form("fPat",()=>post("/api/patients",{name:$("pName").value,rut:$("pRut").value||null,phone:$("pPhone").value||null,allergies:$("pAll").value||null}));
form("fPay",()=>post("/api/payments",{patient_id:+$("yPatient").value,concept:$("yConcept").value,amount:+$("yAmount").value,method:$("yMethod").value}));
form("fCons",()=>{const f=new FormData();f.append("patient_id",$("cPatient").value);f.append("professional_id",$("cPro").value);f.append("diagnosis",$("cDiag").value);f.append("treatment",$("cTreat").value);if($("cFile").files[0])f.append("attachment",$("cFile").files[0]);return api("/api/consultations",{method:"POST",body:f})});
$("day").addEventListener("change",agenda);
$("agendaList").addEventListener("click",async e=>{const b=e.target.closest("button[data-s]");if(!b)return;try{const f=new FormData();f.append("status",b.dataset.s);await api(`/api/appointments/${b.dataset.id}/status`,{method:"POST",body:f});refresh()}catch(x){say(x.message)}});
document.querySelector("nav").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;document.querySelectorAll("nav button").forEach(x=>x.setAttribute("aria-selected",x===b));document.querySelectorAll("main section").forEach(s=>s.hidden=s.id!==b.dataset.t)});
$("day").value=new Date().toISOString().slice(0,10);refresh();
</script>
</body>
</html>
