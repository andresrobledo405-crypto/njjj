<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta data-canvas-width="1080" data-canvas-height="1920">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1080px; height: 1920px; overflow: hidden; }
    body {
      background: linear-gradient(180deg, #87CEEB 0%, #E0F6FF 50%, #90EE90 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Arial', sans-serif;
    }
    
    .scene { position: absolute; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; flex-direction: column; opacity: 0; }
    
    @keyframes slideIn { from { transform: scale(0.5) translateY(100px); opacity: 0; } to { transform: scale(1) translateY(0); opacity: 1; } }
    @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-80px); } }
    @keyframes rotate { from { transform: rotateZ(0deg); } to { transform: rotateZ(360deg); } }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-40px); } }
    @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
    
    .egg { width: 200px; height: 250px; border-radius: 50% 50% 50% 45%; box-shadow: 0 20px 50px rgba(0,0,0,0.2); }
    .egg-red { background: linear-gradient(135deg, #FF6B6B, #FF0000); animation: bounce 0.8s ease-in-out infinite; }
    .egg-blue { background: linear-gradient(135deg, #4ECDC4, #0066FF); animation: bounce 0.8s ease-in-out 0.15s infinite; }
    .egg-yellow { background: linear-gradient(135deg, #FFD93D, #FFA500); animation: bounce 0.8s ease-in-out 0.3s infinite; }
    
    .eggs-container { display: flex; gap: 80px; justify-content: center; animation: slideIn 1s ease-out; }
    
    .animal { font-size: 220px; animation: pulse 0.6s ease-in-out infinite; }
    .title { font-size: 100px; font-weight: bold; color: white; text-shadow: 6px 6px 12px rgba(0,0,0,0.4); margin-top: 60px; text-align: center; animation: slideIn 0.8s ease-out; }
    .subtitle { font-size: 70px; color: #FFD700; text-shadow: 4px 4px 8px rgba(0,0,0,0.3); margin-top: 40px; animation: slideIn 0.8s ease-out 0.2s both; }
    
    .animals-group { display: flex; gap: 200px; justify-content: center; animation: slideIn 0.8s ease-out; }
    .animal-sm { font-size: 180px; animation: float 1.2s ease-in-out infinite; }
    .animal-sm:nth-child(2) { animation-delay: 0.2s; }
    .animal-sm:nth-child(3) { animation-delay: 0.4s; }
  </style>
</head>
<body>
  <!-- ESCENA 1: GANCHO (0-5s) -->
  <div class="scene" id="s0">
    <div class="eggs-container">
      <div class="egg egg-red"></div>
      <div class="egg egg-blue"></div>
      <div class="egg egg-yellow"></div>
    </div>
    <div class="subtitle" style="animation-delay: 0.5s;">¿QUIÉN ESTÁ ADENTRO?</div>
  </div>
  
  <!-- ESCENA 2: POLLITO (5-12s) -->
  <div class="scene" id="s1">
    <div class="animal">🐤</div>
    <div class="title">¡POLLITO!</div>
    <div class="subtitle">¡Pía, pía, pía!</div>
  </div>
  
  <!-- ESCENA 3: PATITO (12-20s) -->
  <div class="scene" id="s2">
    <div class="animal">🦆</div>
    <div class="title">¡PATITO!</div>
    <div class="subtitle">¡Cuá, cuá, cuá!</div>
  </div>
  
  <!-- ESCENA 4: CONEJITO (20-28s) -->
  <div class="scene" id="s3">
    <div class="animal">🐰</div>
    <div class="title">¡CONEJITO!</div>
    <div class="subtitle">¡Hop, hop, hop!</div>
  </div>
  
  <!-- ESCENA 5: TODOS (28-45s) -->
  <div class="scene" id="s4">
    <div class="animals-group">
      <div class="animal-sm">🐤</div>
      <div class="animal-sm">🦆</div>
      <div class="animal-sm">🐰</div>
    </div>
    <div class="title">¡TODOS BAILAN!</div>
  </div>
  
  <!-- ESCENA 6: FINALE (45-60s) -->
  <div class="scene" id="s5">
    <div class="animals-group">
      <div class="animal-sm">🐤</div>
      <div class="animal-sm">🦆</div>
      <div class="animal-sm">🐰</div>
    </div>
    <div class="title" style="font-size: 90px;">¡LOS HUEVITOS!</div>
    <div class="subtitle">❤️ FIN ❤️</div>
  </div>

  <script>
    const scenes = [
      { id: 's0', start: 0, duration: 5 },
      { id: 's1', start: 5, duration: 7 },
      { id: 's2', start: 12, duration: 8 },
      { id: 's3', start: 20, duration: 8 },
      { id: 's4', start: 28, duration: 17 },
      { id: 's5', start: 45, duration: 15 }
    ];
    
    let currentTime = 0;
    const totalDuration = 60;
    
    function updateScenes() {
      scenes.forEach(scene => {
        const el = document.getElementById(scene.id);
        const isActive = currentTime >= scene.start && currentTime < scene.start + scene.duration;
        if (isActive) {
          el.style.opacity = '1';
          el.style.transition = 'opacity 0.5s ease';
        } else {
          el.style.opacity = '0';
          el.style.transition = 'opacity 0.5s ease';
        }
      });
      currentTime += 0.033;
      if (currentTime < totalDuration) {
        requestAnimationFrame(updateScenes);
      }
    }
    
    updateScenes();
  </script>
</body>
</html>
